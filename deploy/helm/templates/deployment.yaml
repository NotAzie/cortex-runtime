apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cortex
  labels:
    app.kubernetes.io/name: cortex-runtime
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cortex-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cortex-runtime
    spec:
      containers:
        - name: cortex-runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
