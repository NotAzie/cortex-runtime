name: Continuous Integration Matrix (Cortex V2)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: V2 Neural Mesh (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pyyaml aiohttp pydantic fastapi httpx

      - name: Execute Full V2 Test Suite
        run: |
          pytest tests/ -v
