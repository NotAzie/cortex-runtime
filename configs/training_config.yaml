# Training Configuration Specification
model:
  base_model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  max_seq_length: 512
  dtype: "bfloat16"
  gradient_checkpointing: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  epochs: 3
  weight_decay: 0.01
  optimizer: "paged_adamw_8bit"
  logging_steps: 10
  save_steps: 100
  eval_steps: 100

data:
  train_file: "cleaned_dataset.json"
  eval_split_ratio: 0.1
  shuffle_seed: 42
